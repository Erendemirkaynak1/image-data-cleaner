name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --json > npm-audit.json || true
      - run: node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.vulnerabilities,null,2))"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build